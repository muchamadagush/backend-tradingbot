services:
  # ===== PostgreSQL 15 Database (Tuned for 2GB RAM VPS) =====
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-crypto-bot-postgres-prod}
    restart: unless-stopped
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=384MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=40
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_bot_prod}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_trading_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-crypto_bot_prod}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== FastAPI Backend (Uses Host Network + 127.0.0.1 DB IP to Eliminate Podman CNI DNS Issues) =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/tradingbot-backend:${ENV_TAG:-latest}
    container_name: ${BACKEND_CONTAINER_NAME:-solana-backend-prod}
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-secure_trading_password}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-crypto_bot_prod}"
      BOT_MODE: ${BOT_MODE:-PAPER}
      IS_SIMULATION: ${IS_SIMULATION:-TRUE}
      ENV_MODE: ${ENV_MODE:-development}
      SOLANA_MAX_POSITIONS: ${SOLANA_MAX_POSITIONS:-1}
      SOLANA_POSITION_SIZE_PCT: ${SOLANA_POSITION_SIZE_PCT:-0.25}
      SOLANA_MIN_TRADE_SOL: ${SOLANA_MIN_TRADE_SOL:-0.025}
      SOLANA_MAX_TRADE_SOL: ${SOLANA_MAX_TRADE_SOL:-0.10}
      SOLANA_RESERVE_GAS_SOL: ${SOLANA_RESERVE_GAS_SOL:-0.020}
      SOLANA_MICRO_SINGLE_EXIT: ${SOLANA_MICRO_SINGLE_EXIT:-true}
    volumes:
      - ./solana_trades.json:/app/solana_trades.json:Z
      - ./solana_positions.json:/app/solana_positions.json:Z
      - ./paper_trading_state.json:/app/paper_trading_state.json:Z
      - ./logs:/app/logs:Z
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
